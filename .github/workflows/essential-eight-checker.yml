name: Essential Eight Checker

on:
  push:
    paths:
      - "essential-eight-checker/**"
      - ".github/workflows/essential-eight-checker.yml"
  pull_request:
    paths:
      - "essential-eight-checker/**"
      - ".github/workflows/essential-eight-checker.yml"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: essential-eight-checker
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q
      - name: Smoke-run sample packs
        run: |
          python -m e8check list-controls
          python -m e8check run --evidence samples/lab_ml1.json
          python -m e8check run --evidence samples/lab_gaps.json
          python -m e8check run --evidence samples/lab_ml3.json
