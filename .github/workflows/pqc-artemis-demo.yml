name: PQC Artemis Demo

on:
  push:
    paths:
      - "pqc-artemis-demo/**"
      - ".github/workflows/pqc-artemis-demo.yml"
  pull_request:
    paths:
      - "pqc-artemis-demo/**"
      - ".github/workflows/pqc-artemis-demo.yml"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pqc-artemis-demo
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q
      - name: Smoke demo
        run: |
          python -m artemis status
          python -m artemis demo
